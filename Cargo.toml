[workspace]
resolver = "3"
members = ["crates/rollcall", "crates/rollcall-cyclonedx", "crates/rollcall-domain"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Electron-libre/rollcall-cli"
# The names `rollcall`, `rollcall-cli` and `rollcall-core` are taken on crates.io: settle the names before publishing.
publish = false

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
