[workspace]
resolver = "3"
members = [
    "crates/forewarn",
    "crates/forewarn-api",
    "crates/forewarn-cache",
    "crates/forewarn-cyclonedx",
    "crates/forewarn-domain",
    "crates/forewarn-exploited",
    "crates/forewarn-osv",
    "crates/forewarn-upload",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Electron-libre/forewarn-cli"
# The forewarn names are free on crates.io (2026-11-12); publishing waits for its own decision.
publish = false

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
