name: Check

# The project check (format, lint, tests) of every push to main and every pull request, and the dependency policy of
# `deny.toml`, also run each day so that a new advisory turns main red without a push. A file of its own:
# `cardinal.yml` is synced by Cardinal and must not be edited.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The scheduled run checks the dependencies alone: the code has not changed since the last push.
    - cron: '23 5 * * *'

concurrency:
  group: check-${{ github.ref }}
  # A push to main keeps its run: each commit of main gets its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: project check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The check_command does not pass --locked: refuse a Cargo.lock out of date before it runs.
      - run: cargo fetch --locked
      - name: Run the check_command of .claude/cardinal.toml
        run: |
          command=$(python3 -c 'import tomllib; print(tomllib.load(open(".claude/cardinal.toml", "rb"))["project"]["check_command"])')
          echo "$command"
          sh -c "$command"

  msrv:
    name: build on the rust-version
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the rust-version of Cargo.toml
        id: msrv
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  test:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Windows waits for issues/support_windows_paths.md.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every test binary runs: one red run shows all the failures of the platform.
      - run: cargo test --locked --no-fail-fast

  dependencies:
    name: licenses, advisories, bans and sources of the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The policy of deny.toml: the licenses about.toml accepts, no RustSec advisory nor yanked crate, crates.io only.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
          arguments: --locked
