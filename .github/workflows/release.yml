name: Release

# The release binaries of each pushed tag `v<version>` (ADR 0015), attached to a GitHub release with their checksums,
# the SBOM of each and the attestation of their build provenance. Each archive holds the license notices of the crates
# its binary includes.
# A pull request that changes this file builds them without publishing.

on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the workspace version, refuse a tag that names another
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not name the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  notices:
    name: write the license notices and the SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install --locked cargo-about@0.9.3 --features cli
          cargo install --locked cargo-cyclonedx@0.5.10
      - name: Write the license notices of the targets of about.toml
        run: cargo about generate --locked --fail -c about.toml -m crates/forewarn/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES
      - name: Write the SBOM of each target and read it with forewarn
        run: |
          mkdir sbom
          targets=$(python3 -c 'import tomllib; print(" ".join(tomllib.load(open("about.toml", "rb"))["targets"]))')
          for target in $targets; do
            cargo cyclonedx -q --manifest-path crates/forewarn/Cargo.toml -f json --spec-version 1.6 \
              --target "$target" --no-build-deps --override-filename "forewarn-$target.cdx"
            mv "crates/forewarn/forewarn-$target.cdx.json" sbom/
            cargo run -q --locked -p forewarn -- check --allow-incomplete "sbom/forewarn-$target.cdx.json" > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: |
            THIRD-PARTY-LICENSES
            sbom/
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: [version, notices]
    strategy:
      fail-fast: false
      matrix:
        # Windows waits for issues/support_windows_paths.md. `run`: the runner can execute the binary.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: forewarn-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      # ring compiles C for the target: musl needs its compiler wrapper, which cc-rs does not look for by this name.
      - if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p forewarn --target ${{ matrix.target }}
      - name: Check the binary prints the version
        if: matrix.run
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printed=$("target/${{ matrix.target }}/release/forewarn" --version)
          echo "$printed"
          [ "$printed" = "forewarn $VERSION" ]
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: notices
      - name: Pack the archive
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/forewarn" LICENSE-MIT LICENSE-APACHE README.md \
            notices/THIRD-PARTY-LICENSES "$ARCHIVE/"
          cp "notices/sbom/$ARCHIVE.cdx.json" "$ARCHIVE/forewarn.cdx.json"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  release:
    name: publish the release
    if: github.ref_type == 'tag'
    needs: [version, notices, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forewarn-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notices
          path: notices
      - name: Write the checksums
        run: |
          cp notices/sbom/*.cdx.json dist/
          cd dist && sha256sum -- *.tar.gz *.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "forewarn $VERSION" --notes-file notes.md dist/*
