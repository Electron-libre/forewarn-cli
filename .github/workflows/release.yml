name: Release

# The release binaries of each pushed tag `v<version>` (ADR 0015), attached to a GitHub release with their checksums.
# A pull request that changes this file builds them without publishing.

on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the workspace version, refuse a tag that names another
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not name the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Windows waits for issues/support_windows_paths.md. `run`: the runner can execute the binary.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: forewarn-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      # ring compiles C for the target: musl needs its compiler wrapper, which cc-rs does not look for by this name.
      - if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p forewarn --target ${{ matrix.target }}
      - name: Check the binary prints the version
        if: matrix.run
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printed=$("target/${{ matrix.target }}/release/forewarn" --version)
          echo "$printed"
          [ "$printed" = "forewarn $VERSION" ]
      - name: Pack the archive
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/forewarn" LICENSE-MIT LICENSE-APACHE README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  release:
    name: publish the release
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "forewarn $VERSION" --notes-file notes.md dist/*
