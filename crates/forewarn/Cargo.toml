[package]
name = "forewarn"
description = "Match a CycloneDX SBOM against actively exploited vulnerabilities and draft the CRA early warning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
forewarn-cyclonedx = { path = "../forewarn-cyclonedx" }
forewarn-domain = { path = "../forewarn-domain" }
forewarn-exploited = { path = "../forewarn-exploited" }
forewarn-osv = { path = "../forewarn-osv" }
forewarn-upload = { path = "../forewarn-upload" }
serde_json = "1"
tempfile = "3"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml = "0.9"

[lints]
workspace = true
