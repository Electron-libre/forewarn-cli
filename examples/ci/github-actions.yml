# forewarn in GitHub Actions: copy this file to `.github/workflows/forewarn.yml` of your product's repository.
#
# On each release tag, and each day on the latest release tag, it produces the CycloneDX SBOM of the release, reports
# the components missing what the CRA expects, matches them against OSV, the CISA KEV catalog and EUVD, and fails when
# one is affected by an actively exploited vulnerability, the report and the draft early warnings kept as artifacts.
# On a tag, it also uploads the SBOM to a Forewarn service. Only the inventory leaves the runner, never the source code.
#
# Documentation: https://github.com/Electron-libre/forewarn-cli/blob/main/docs/user-guide.md#in-ci

name: forewarn

on:
  # A release: check what ships.
  push:
    tags: ['v*']
  # Each day, the latest release again: a vulnerability becomes actively exploited without a change of your code, and
  # CRA article 14 gives 24 hours from the moment you know it for the early warning. Another release line you still
  # support needs a run of its own (a copy of this job checking out its tag).
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release of forewarn to install, and the archive of the runner's platform.
  FOREWARN_VERSION: 0.5.0
  TARGET: x86_64-unknown-linux-musl

jobs:
  forewarn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release to check: the pushed tag, else the latest tag `v*` of the history, so the daily run checks what
      # your users have, not the default branch; before a first tag, the commit checked out.
      - name: Check out the release
        id: product
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          elif tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            git checkout --quiet "$tag"
            version=${tag#v}
          else
            echo "::notice::no tag v* yet: checking the commit $GITHUB_SHA"
            version=$GITHUB_SHA
          fi
          # The product name and version name the SBOM, the draft early warnings and the upload.
          echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Installed outside the checkout, so the SBOM of your product does not take in forewarn and its files.
      - name: Install forewarn, checked against the SHA256SUMS of its release
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/Electron-libre/forewarn-cli/releases/download/v$FOREWARN_VERSION"
          curl -fsSL --fail-early -O "$base/forewarn-$TARGET.tar.gz" -O "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "forewarn-$TARGET.tar.gz"
          sudo install "forewarn-$TARGET/forewarn" /usr/local/bin/
          forewarn --version

      # forewarn reads an SBOM, it does not detect dependencies. syft scans the checkout, but names your product
      # without a package URL: forewarn then cannot tell your own packages from the third-party ones and matches them
      # too. The tool of your ecosystem names it (`cargo cyclonedx` for Rust, `cdxgen` for many languages): prefer it,
      # writing CycloneDX JSON to sbom.cdx.json.
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.57.2
      - name: Produce the SBOM
        id: sbom
        env:
          PRODUCT: ${{ steps.product.outputs.name }}
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          syft scan dir:. --source-name "$PRODUCT" --source-version "$VERSION" -o cyclonedx-json=sbom.cdx.json

      # The OSV archives, the CISA KEV catalog, the EUVD list and the moments of awareness, kept between runs: each
      # run restores the latest copy of its job and saves its own, even when the job fails (a key cannot be
      # overwritten, so one per run and per job, a copy of this job keeping its own; GitHub evicts the oldest).
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/forewarn
          key: forewarn-feeds-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forewarn-feeds-${{ github.job }}-

      # The gaps of the SBOM (supplier, license, hashes), reported without failing the job.
      - name: Check the SBOM
        run: forewarn check --allow-incomplete sbom.cdx.json

      # Exits with 0 when components are affected but none is actively exploited, with 6 when one is: the job fails
      # then, and the drafts of the early warnings are ready to complete. The feeds are downloaded again when older
      # than 12 hours, so a daily run never matches against the lists of the day before.
      # The 24 h and 72 h deadlines of each exploited CVE count from the first run that flagged it: --awareness keeps
      # that moment, kept with the feeds, so a later run shows the deadlines left or overdue. A cache GitHub evicted
      # (unused for 7 days) restarts them from the next run. The cache of a tag run stays with its tag: a CVE it flags
      # first is recorded again by the next daily run, which restores the cache of the default branch only.
      - name: Match the SBOM against the vulnerabilities
        run: |
          forewarn match --allow-affected --refresh 12h --awareness ~/.cache/forewarn/awareness.json \
            --format json --drafts drafts sbom.cdx.json > forewarn.json

      - if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/forewarn
          key: forewarn-feeds-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the SBOM, the report and the drafts
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: forewarn
          path: |
            sbom.cdx.json
            forewarn.json
            drafts/
          if-no-files-found: warn

      # On a tag, the SBOM is uploaded whatever the match found: the service keeps the inventory of every release.
      # Set the secrets FOREWARN_ENDPOINT and FOREWARN_TOKEN of the repository; remove this step without a service.
      - name: Upload the SBOM of the release
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && github.ref_type == 'tag' }}
        env:
          FOREWARN_ENDPOINT: ${{ secrets.FOREWARN_ENDPOINT }}
          FOREWARN_TOKEN: ${{ secrets.FOREWARN_TOKEN }}
        run: forewarn upload sbom.cdx.json
